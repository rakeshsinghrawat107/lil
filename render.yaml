services:
  - type: web
    name: tapmi-backend-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.db.migrate && python -m backend.app.db.seed && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 backend.run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: .
      - key: FLASK_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
